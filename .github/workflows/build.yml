name: Build

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  VULKAN_SDK: C:\VulkanSDK\1.3.296.0
  VULKAN_SDK_VERSION: 1.3.296.0
  VULKAN_SDK_SHA256: acb4ae0786fd3e558f8b3c36cc3eba91638984217ba8a6795ec64d2f9ffd8c4b

concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build / ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3
        with:
          nuget-version: 6.14.3

      - name: Cache Vulkan SDK
        id: cache-vulkan-sdk
        uses: actions/cache@v5
        with:
          path: ${{ env.VULKAN_SDK }}
          key: ${{ runner.os }}-${{ runner.arch }}-vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-${{ env.VULKAN_SDK_SHA256 }}

      - name: Install Vulkan SDK
        if: steps.cache-vulkan-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installerName = "VulkanSDK-$env:VULKAN_SDK_VERSION-Installer.exe"
          $installerPath = Join-Path $env:RUNNER_TEMP $installerName
          $installerUri =
            "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/$installerName"

          Invoke-WebRequest -Uri $installerUri -OutFile $installerPath

          $actualSha256 = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash
          if ($actualSha256 -ine $env:VULKAN_SDK_SHA256) {
            throw "Vulkan SDK installer SHA-256 mismatch: expected '$env:VULKAN_SDK_SHA256', got '$actualSha256'."
          }

          & $installerPath --root $env:VULKAN_SDK --accept-licenses --default-answer `
            --confirm-command install copy_only=1
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Validate Vulkan SDK
        shell: pwsh
        run: |
          $requiredPaths = @(
            (Join-Path $env:VULKAN_SDK "Include\vulkan\vulkan.h")
            (Join-Path $env:VULKAN_SDK "Lib\vulkan-1.lib")
            (Join-Path $env:VULKAN_SDK "Bin\vulkan-1.dll")
            (Join-Path $env:VULKAN_SDK "Bin\spirv-val.exe")
          )
          foreach ($requiredPath in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "Required Vulkan SDK file is missing: '$requiredPath'."
            }
          }

          (Join-Path $env:VULKAN_SDK "Bin") | Out-File -FilePath $env:GITHUB_PATH `
            -Encoding utf8 -Append

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-6.14.3-${{ hashFiles('Projects/Application/packages.config') }}

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $restoreArguments = @(
            "restore"
            "GraphicsGadgetLab.sln"
            "-PackagesDirectory"
            "packages"
            "-NonInteractive"
            "-Verbosity"
            "normal"
          )

          nuget @restoreArguments

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Build\Logs | Out-Null

          $buildArguments = @(
            "GraphicsGadgetLab.sln"
            "/m"
            "/t:Build"
            "/p:Configuration=${{ matrix.configuration }}"
            "/p:Platform=x64"
            "/verbosity:minimal"
            "/nologo"
            "/bl:Build\Logs\gglab-${{ matrix.configuration }}.binlog"
          )

          msbuild @buildArguments

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run headless self-tests
        shell: pwsh
        working-directory: Build/Output/x64/${{ matrix.configuration }}
        run: |
          & .\GraphicsGadgetLab.exe --self-test all
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload MSBuild binlog
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: msbuild-binlog-${{ matrix.configuration }}
          path: Build/Logs/gglab-${{ matrix.configuration }}.binlog
          if-no-files-found: ignore
          retention-days: 7
