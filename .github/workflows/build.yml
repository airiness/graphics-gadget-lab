name: Build

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  VULKAN_SDK_VERSION: 1.3.296.0
  VULKAN_SDK_SHA256: acb4ae0786fd3e558f8b3c36cc3eba91638984217ba8a6795ec64d2f9ffd8c4b
  VULKAN_RUNTIME_SHA256: e0429f91cf356fe99e381f7d22e568ac81945669f1be1772d933a0d189230452

concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build / ${{ matrix.display_name }}
    runs-on: windows-2022
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - display_name: Debug
            configuration: Debug
            pch: enabled
            log_name: Debug
          - display_name: Release
            configuration: Release
            pch: enabled
            log_name: Release
          - display_name: Debug (no PCH)
            configuration: Debug
            pch: disabled
            log_name: Debug-no-PCH

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3
        with:
          nuget-version: 6.14.3

      - name: Configure Vulkan paths
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP "VulkanSDK\$env:VULKAN_SDK_VERSION"
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "VulkanRT\$env:VULKAN_SDK_VERSION"
          "VULKAN_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VULKAN_RUNTIME=$runtimeRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache Vulkan environment
        id: cache-vulkan-environment
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
            ${{ runner.temp }}\VulkanRT\${{ env.VULKAN_SDK_VERSION }}
          key: ${{ runner.os }}-${{ runner.arch }}-vulkan-${{ env.VULKAN_SDK_VERSION }}-${{ env.VULKAN_SDK_SHA256 }}-${{ env.VULKAN_RUNTIME_SHA256 }}

      - name: Install Vulkan SDK and runtime
        if: steps.cache-vulkan-environment.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installerName = "VulkanSDK-$env:VULKAN_SDK_VERSION-Installer.exe"
          $installerPath = Join-Path $env:RUNNER_TEMP $installerName
          $installerUri =
            "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/$installerName"

          Invoke-WebRequest -Uri $installerUri -OutFile $installerPath

          $actualSha256 = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash
          if ($actualSha256 -ine $env:VULKAN_SDK_SHA256) {
            throw "Vulkan SDK installer SHA-256 mismatch: expected '$env:VULKAN_SDK_SHA256', got '$actualSha256'."
          }

          & $installerPath --root $env:VULKAN_SDK --accept-licenses --default-answer `
            --confirm-command install copy_only=1
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $runtimeArchiveName = "VulkanRT-$env:VULKAN_SDK_VERSION-Components.zip"
          $runtimeArchivePath = Join-Path $env:RUNNER_TEMP $runtimeArchiveName
          $runtimeArchiveUri =
            "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/$runtimeArchiveName"

          Invoke-WebRequest -Uri $runtimeArchiveUri -OutFile $runtimeArchivePath

          $actualRuntimeSha256 =
            (Get-FileHash -LiteralPath $runtimeArchivePath -Algorithm SHA256).Hash
          if ($actualRuntimeSha256 -ine $env:VULKAN_RUNTIME_SHA256) {
            throw "Vulkan runtime SHA-256 mismatch: expected '$env:VULKAN_RUNTIME_SHA256', got '$actualRuntimeSha256'."
          }

          Expand-Archive -LiteralPath $runtimeArchivePath -DestinationPath $env:VULKAN_RUNTIME

      - name: Validate Vulkan environment
        shell: pwsh
        run: |
          $runtimeBin = Join-Path $env:VULKAN_RUNTIME `
            "VulkanRT-$env:VULKAN_SDK_VERSION-Components\x64"
          $requiredPaths = @(
            (Join-Path $env:VULKAN_SDK "Include\vulkan\vulkan.h")
            (Join-Path $env:VULKAN_SDK "Lib\vulkan-1.lib")
            (Join-Path $env:VULKAN_SDK "Bin\spirv-val.exe")
            (Join-Path $runtimeBin "vulkan-1.dll")
          )
          foreach ($requiredPath in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "Required Vulkan SDK file is missing: '$requiredPath'."
            }
          }

          (Join-Path $env:VULKAN_SDK "Bin") | Out-File -FilePath $env:GITHUB_PATH `
            -Encoding utf8 -Append
          $runtimeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-6.14.3-${{ hashFiles('Projects/Application/packages.config') }}

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $restoreArguments = @(
            "restore"
            "GraphicsGadgetLab.sln"
            "-PackagesDirectory"
            "packages"
            "-NonInteractive"
            "-Verbosity"
            "normal"
          )

          nuget @restoreArguments

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Validate no-PCH source boundary
        if: matrix.pch == 'disabled'
        shell: pwsh
        run: |
          $pchCreatorSource =
            (Resolve-Path -LiteralPath "Sources\Application\Application\ApplicationPch.cpp").Path
          $sourceExtensions = @(".cpp", ".h", ".hpp", ".inl")
          $unexpectedIncludes = @(
            Get-ChildItem -LiteralPath Sources -Recurse -File |
              Where-Object {
                $_.Extension -in $sourceExtensions -and
                $_.FullName -ne $pchCreatorSource
              } |
              Select-String -Pattern '^\s*#\s*include\s*[<"]Application/ApplicationPch\.h[>"]'
          )

          if ($unexpectedIncludes.Count -ne 0) {
            $locations = $unexpectedIncludes | ForEach-Object {
              "$($_.Path):$($_.LineNumber)"
            }
            throw "Source-level PCH includes are not allowed: $($locations -join ', ')"
          }

      - name: Validate generated project filters
        shell: pwsh
        run: |
          ./Scripts/GenerateProjectFilters.ps1 -Check

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Validate project ownership and first-party boundaries
        shell: pwsh
        run: |
          ./Scripts/ValidateProjectBoundaries.ps1

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build GGLabFoundation standalone
        if: matrix.pch == 'enabled'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Build\Logs | Out-Null

          $foundationBuildArguments = @(
            "Projects\GGLabFoundation\GGLabFoundation.vcxproj"
            "/m"
            "/t:Build"
            "/p:Configuration=${{ matrix.configuration }}"
            "/p:Platform=x64"
            "/verbosity:minimal"
            "/nologo"
            "/bl:Build\Logs\gglab-foundation-standalone-${{ matrix.log_name }}.binlog"
          )

          msbuild @foundationBuildArguments

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build and run GGLabFoundation link probe
        if: matrix.pch == 'enabled'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Build\Logs | Out-Null

          $foundationTestsBuildArguments = @(
            "Projects\GGLabFoundationTests\GGLabFoundationTests.vcxproj"
            "/m"
            "/t:Build"
            "/p:Configuration=${{ matrix.configuration }}"
            "/p:Platform=x64"
            "/verbosity:minimal"
            "/nologo"
            "/bl:Build\Logs\gglab-foundation-tests-${{ matrix.log_name }}.binlog"
          )

          msbuild @foundationTestsBuildArguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build GGLabRuntime standalone
        if: matrix.pch == 'enabled'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Build\Logs | Out-Null

          $runtimeBuildArguments = @(
            "Projects\GGLabRuntime\GGLabRuntime.vcxproj"
            "/m"
            "/t:Build"
            "/p:Configuration=${{ matrix.configuration }}"
            "/p:Platform=x64"
            "/verbosity:minimal"
            "/nologo"
            "/bl:Build\Logs\gglab-runtime-standalone-${{ matrix.log_name }}.binlog"
          )

          msbuild @runtimeBuildArguments

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build GGLabAppRuntime standalone
        if: matrix.pch == 'enabled'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Build\Logs | Out-Null

          $appRuntimeBuildArguments = @(
            "Projects\GGLabAppRuntime\GGLabAppRuntime.vcxproj"
            "/m"
            "/t:Build"
            "/p:Configuration=${{ matrix.configuration }}"
            "/p:Platform=x64"
            "/verbosity:minimal"
            "/nologo"
            "/bl:Build\Logs\gglab-app-runtime-standalone-${{ matrix.log_name }}.binlog"
          )

          msbuild @appRuntimeBuildArguments

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build GGLabAppRuntimeTests standalone
        if: matrix.pch == 'enabled'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Build\Logs | Out-Null

          $appRuntimeTestsBuildArguments = @(
            "Projects\GGLabAppRuntimeTests\GGLabAppRuntimeTests.vcxproj"
            "/m"
            "/t:Build"
            "/p:Configuration=${{ matrix.configuration }}"
            "/p:Platform=x64"
            "/verbosity:minimal"
            "/nologo"
            "/bl:Build\Logs\gglab-app-runtime-tests-${{ matrix.log_name }}.binlog"
          )

          msbuild @appRuntimeTestsBuildArguments

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build Application standalone
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Build\Logs | Out-Null

          $applicationBuildArguments = @(
            "Projects\Application\Application.vcxproj"
            "/m"
            "/t:Build"
            "/p:Configuration=${{ matrix.configuration }}"
            "/p:Platform=x64"
            "/verbosity:minimal"
            "/nologo"
            "/bl:Build\Logs\gglab-application-standalone-${{ matrix.log_name }}.binlog"
          )

          if ("${{ matrix.pch }}" -eq "disabled") {
            $applicationBuildArguments += "/p:GGLAB_USE_PCH=0"
          }

          msbuild @applicationBuildArguments

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build solution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Build\Logs | Out-Null

          $buildArguments = @(
            "GraphicsGadgetLab.sln"
            "/m"
            "/t:Build"
            "/p:Configuration=${{ matrix.configuration }}"
            "/p:Platform=x64"
            "/verbosity:minimal"
            "/nologo"
            "/bl:Build\Logs\gglab-${{ matrix.log_name }}.binlog"
          )

          if ("${{ matrix.pch }}" -eq "disabled") {
            $buildArguments += "/p:GGLAB_USE_PCH=0"
          }

          msbuild @buildArguments

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run headless self-tests from unrelated CWD (Application)
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $application = Join-Path "${{ github.workspace }}" `
            "Build\Output\x64\${{ matrix.configuration }}\GraphicsGadgetLab.exe"
          & $application --self-test all
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Prove runtime path composition from unrelated CWD
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $application = Join-Path "${{ github.workspace }}" `
            "Build\Output\x64\${{ matrix.configuration }}\GraphicsGadgetLab.exe"
          & $application --self-test app-path-composition
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run headless self-tests (GGLabFoundationTests)
        shell: pwsh
        working-directory: Build/Output/x64/${{ matrix.configuration }}
        run: |
          & .\GGLabFoundationTests.exe
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run headless self-tests (GGLabRuntimeTests)
        shell: pwsh
        working-directory: Build/Output/x64/${{ matrix.configuration }}
        run: |
          & .\GGLabRuntimeTests.exe --suite all
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run headless self-tests (GGLabAppRuntimeTests)
        if: matrix.pch == 'enabled'
        shell: pwsh
        working-directory: Build/Output/x64/${{ matrix.configuration }}
        run: |
          & .\GGLabAppRuntimeTests.exe
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run headless self-tests (NapaVoxelCoreTests)
        shell: pwsh
        working-directory: Build/Output/x64/${{ matrix.configuration }}
        run: |
          & .\NapaVoxelCoreTests.exe --suite all
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload MSBuild binlog
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: msbuild-binlog-${{ matrix.log_name }}
          path: |
            Build/Logs/gglab-${{ matrix.log_name }}.binlog
            Build/Logs/gglab-application-standalone-${{ matrix.log_name }}.binlog
            Build/Logs/gglab-foundation-standalone-${{ matrix.log_name }}.binlog
            Build/Logs/gglab-foundation-tests-${{ matrix.log_name }}.binlog
            Build/Logs/gglab-runtime-standalone-${{ matrix.log_name }}.binlog
            Build/Logs/gglab-app-runtime-standalone-${{ matrix.log_name }}.binlog
            Build/Logs/gglab-app-runtime-tests-${{ matrix.log_name }}.binlog
          if-no-files-found: ignore
          retention-days: 7
